name: Monitor 4549
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow numpy astropy pandas fpdf
      - run: python auto_4549_vivo.py
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      - run: |
          git config user.name "martin-esime"
          git config user.email "martin-esime@users.noreply.github.com"
          git add tabla_30.csv || true
          git add *.pdf 2>/dev/null || true
          git add -A
          git diff --staged --quiet || git commit -m "auto: update 4549 - magnetograma real"
          git push
